<body>
    <div id="root"></div>
    <script>
      // SPA redirect recovery for GitHub Pages
      // 404.html encodes the path as /?/path — we restore it here
      // so React Router receives the correct location.
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
    <script type="module" src="/src/main.tsx"></script>
